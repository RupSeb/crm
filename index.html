<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c2723">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CRM">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Gewähltes Farbschema vor dem ersten Zeichnen setzen, damit nichts aufblitzt
    try {
      var t = localStorage.getItem('crm-theme');
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <title>CRM</title>
</head>
<body>
  <div id="app"><div class="boot">Lädt …</div></div>
  <script type="module" src="app.js"></script>
</body>
</html>
